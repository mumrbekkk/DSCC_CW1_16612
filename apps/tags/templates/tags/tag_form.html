{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow-sm">
            <div class="card-body">

                <h3 class="mb-4">
                    {% if form.instance.pk %}
                        Edit Tag
                    {% else %}
                        Create Tag
                    {% endif %}
                </h3>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        {{ form.name.label_tag }}
                        {{ form.name }}
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Save Tag
                    </button>

                    <a href="{% url 'tag_list' %}" class="btn btn-secondary">
                        Cancel
                    </a>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
