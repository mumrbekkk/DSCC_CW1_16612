server {
    listen 80;
    server_name taskflow.lccrm.uz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name taskflow.lccrm.uz;

    ssl_certificate /etc/letsencrypt/live/taskflow.lccrm.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskflow.lccrm.uz/privkey.pem;

    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        proxy_pass http://django-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
