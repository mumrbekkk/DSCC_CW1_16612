services:
  django-app:
    image: mumrbekkk/taskflow-django:latest
    container_name: task_flow_django_app
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - static_volume:/static
      - media_volume:/media

  postgres:
    image: postgres:17
    container_name: task_flow_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: task_flow_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - django-app

volumes:
  postgres_data:
  static_volume:
  media_volume:
