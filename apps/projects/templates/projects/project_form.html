{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm">
            <div class="card-body">

                <h3 class="mb-4">Project Form</h3>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        {{ form.name.label_tag }}
                        {{ form.name }}
                    </div>

                    <div class="mb-3">
                        {{ form.description.label_tag }}
                        {{ form.description }}
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>

                    {% if project %}
                      <a href="{% url 'project_detail' project.pk %}" class="btn btn-secondary">
                          Cancel
                      </a>
                    {% else %}
                      <a href="{% url 'project_list' %}" class="btn btn-secondary">
                          Cancel
                      </a>
                    {% endif %}
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
